name: agent

on:
  schedule:
    # 8:55 ET winter / 9:55 ET summer (UTC). The loop exits if the market isn't opening soon.
    - cron: "55 13 * * 1-5"
    - cron: "55 14 * * 1-5"
  workflow_dispatch:

concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      AGENT_PAPER: "true"              # real money: change to "false", set AGENT_LIVE_CONFIRM, add AGENT_ALPACA_* secrets
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
      - run: python -m agent.loop
