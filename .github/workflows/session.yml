name: session

on:
  schedule:
    # Backup only. Each run starts the next one itself (last step below), so the chain
    # runs around the clock. GitHub delays or drops scheduled runs (it skipped every one on
    # Nov 5), so these just restart the chain if it ever breaks.
    - cron: "0,20,40 13-20 * * 1-5"
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Stop after this many minutes (default 345)"
        required: false
        default: "345"
      chain:
        description: "Start the next run when this one ends (no = one-off test)"
        required: false
        default: "yes"

concurrency:
  group: trading            # only one job touches state at a time
  cancel-in-progress: false

permissions:
  contents: write
  actions: write            # lets a run start the next run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: "true"
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
      - name: Session (every minute in market hours, hourly snapshots otherwise)
        run: python -m tournament.session --max-minutes ${{ github.event.inputs.max_minutes || '345' }}
      - name: Start the next run
        # Not after a manual cancel (that's how you stop the chain), and not for one-off tests.
        if: ${{ !cancelled() && github.event.inputs.chain != 'no' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run session -R ${{ github.repository }}
